baseURL = 'https://go-numerics.github.io/'
locale  = 'en-us'
title   = 'go-numerics'
# No theme -- the layout is the go-* family template (go-fileshare.github.io's,
# via logos/landing-kit, as go-plot and go-notebook use it): one
# self-contained layouts/index.html, partials/styles.html (the shared sheet,
# byte-identical) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-numerics: numerical methods in pure Go (CGO=0) on go-ndarray. Optimisation and root finding, quadrature and ODE solvers, special functions, ported from their reference algorithms and tested against recorded answers."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "optimize"
  kind  = "library"
  href  = "https://github.com/go-numerics/optimize"
  blurb = "Minimisation (Nelder–Mead, Powell, CG, BFGS, Newton-CG, L-BFGS-B), constrained minimisation (SLSQP and the trust-constr interior-point method: bounds, equality and inequality constraints), quadratic programming (<code>Quadprog</code>: Goldfarb–Idnani active set and OSQP v1.0.0's ADMM, dense or sparse), global optimisation (differential evolution, basin hopping and DIRECT, on SciPy's exact random streams), scalar and system roots (Brent, MINPACK hybrd), nonlinear least squares (Levenberg–Marquardt, trust-region reflective, robust losses), curve fitting with covariance, linear programming (simplex, interior point)."
[[params.repos]]
  name  = "integrate"
  kind  = "library"
  href  = "https://github.com/go-numerics/integrate"
  blurb = "Adaptive quadrature ported from the netlib QUADPACK, fixed and sample rules, double, triple and N-dimensional integrals, and initial value problems with RK45, RK23, DOP853, Radau, BDF and automatic stiffness switching, with events and dense output."
[[params.repos]]
  name  = "special"
  kind  = "library"
  href  = "https://github.com/go-numerics/special"
  blurb = "Gamma, beta, error and normal functions, incomplete gamma and beta and their inverses, Bessel, zeta, combinatorics, logistic helpers and complete elliptic integrals, each measured in ULPs against mpmath; <code>special/nd</code> applies them element-wise to go-ndarray arrays, across cores."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-numerics.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): one section per library, made of its own README, design, verification, accuracy and performance documents, with figures each library computed. <a href=\"https://github.com/go-numerics/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-numerics/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the README of the library it names, at v0.1.0.
[[params.checks]]
  name = "QUADPACK, path for path"
  what = "116 of 124 fixture integrals take exactly SciPy 1.18.1's subdivision path: the same evaluation count, the value to 1e-12. Three of the others are where SciPy's C translation departs from the netlib Fortran, and this port agrees with the Fortran. (integrate)"
[[params.checks]]
  name = "ODE solvers, step for step"
  what = "110 of 120 `solve_ivp` runs of the ported methods take exactly SciPy's steps: the same function evaluations, steps, Jacobians and LU decompositions. (integrate)"
[[params.checks]]
  name = "Minimisers on the reference path"
  what = "On the arithmetic-only problems, 36 of 38 `Minimize` runs take SciPy's exact path (identical nit, nfev, njev); L-BFGS-B is bit-identical to SciPy's C code built with sequential BLAS. (optimize)"
[[params.checks]]
  name = "SLSQP on Hock–Schittkowski"
  what = "100 of 100 statuses and 88 of 100 runs on SciPy's exact path (nit, nfev, njev, multipliers) over 36 Hock–Schittkowski problems and 10 stress cases; on each of the other 12, SciPy's own arm64 and x86_64 wheels disagree with each other. (optimize v0.3.0)"
[[params.checks]]
  name = "trust-constr on the same set"
  what = "The interior-point method on the same 100 runs: success or failure as SciPy on all 100, every successful objective within 1e-5 of SciPy's or 1e-4 of the optimum; 59 to 68 runs on SciPy's exact path, where SciPy's own two wheels disagree on 35. (optimize v0.4.0)"
[[params.checks]]
  name = "Quadratic programming against OSQP"
  what = "`Quadprog`'s ADMM runs exactly OSQP v1.0.0's iterations (same status, iteration and ρ-update counts) on 38 of 38 planted and 12 of 12 sparse cases, and on 25 of 25 generated benchmark instances; on 33 Maros–Mészáros problems it reaches Clarabel's objective on 27 and ends with OSQP's own status on the other 6. The active set is checked against Clarabel and the quadprog package. (optimize v0.5.0)"
[[params.checks]]
  name = "Global optimisation against SciPy"
  what = "`DifferentialEvolution` without polishing: 296 of 296 runs bit-identical to SciPy 1.18.1 (final population, energies, counts), constraints and integer variables included, for both seeding forms (PCG64, MT19937). `Basinhopping`: SciPy's accept decisions on 224 of 224 runs, 136 bit-identical. `Direct`: 618 arithmetic runs bit-identical. Over 100 seeds on 21 of SciPy's own benchmark functions the success counts agree (equal on 16 of 16 DE functions, Fisher p > 0.4 on all 8 basin-hopping ones). (optimize v0.6.0)"
[[params.checks]]
  name = "MINPACK and HiGHS"
  what = "`Root`/`Fsolve`: 23 of 23 runs with identical counts, status and message, x bit-identical. `Linprog`: 46 of 46 statuses against HiGHS, objective error at most 1.8e-15 with the simplex. (optimize)"
[[params.checks]]
  name = "Special functions in ULPs"
  what = "About 250 000 points in 419 regions over 62 functions, against mpmath at high precision: the maximum error is at or below SciPy's in 418 regions, and the one exception is a tie at 1.05 ulp. (special)"
[[params.checks]]
  name = "Negative controls"
  what = "One thing broken at a time — a BFGS term dropped, a sign flipped in Moré–Thuente, a Kronrod weight nudged by 1e-6, a coefficient of the Γ(1+t) core moved by 1.5 ulp — and each break makes the suite fail. (optimize, integrate, special)"

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.57:1, bright on the dark background 7.70:1.
  base = "#7445ad"
  deep = "#472a6a"
  bright = "#b794e4"
  shadow = "rgba(116,69,173,.7)"
  glow = "rgba(116,69,173,.6)"
  wash = "rgba(116,69,173,.10)"
  washDeep = "rgba(71,42,106,.06)"
  chipBg = "#f6f2fc"
  chipBorder = "#e9dff7"
  chipFg = "#472a6a"
  chipBgDark = "rgba(183,148,228,.14)"
  chipBorderDark = "rgba(183,148,228,.32)"
  chipFgDark = "#d7c4f0"
