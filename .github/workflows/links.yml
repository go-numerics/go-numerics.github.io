name: links

# The landing had a link to https://github.com/go-fileshare/authnd, which is a
# 404: authnd lives in go-authn. The organisation profile carries the SAME link
# and has it right, because .github/ has a link check and this repository did
# not. A dead link on a landing page breaks nothing that complains.
#
# ⛔ THE CHECK READS THE BUILT SITE, NOT THE LAYOUTS. The first version of this
# file grepped layouts/ and failed on its own first run against
# `https://github.com/go-fileshare/{{ .name }}` -- a Hugo template expression,
# not a URL. Skipping anything with a brace in it would have "fixed" that and
# left the per-repository card links unchecked, which is most of the page's
# links. Building first expands them into the URLs a reader actually gets,
# which is the only set worth checking.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify --destination ./public
      - name: Check
        run: |
          set -uo pipefail
          # The character class matters: an extractor that stops only at ) and "
          # carries a closing > or < into the request.
          urls=$(grep -rhoE 'https?://[^)">< [:space:]]+' public/ | sed 's/[.,]$//' | sort -u)
          test -n "$urls" || { echo "::error::no links found; did the site build?"; exit 1; }
          echo "checking $(printf '%s\n' "$urls" | wc -l) distinct URLs"
          fail=0
          while read -r u; do
            # img.shields.io renders anything asked of it and proves nothing.
            case "$u" in *img.shields.io*) continue ;; esac
            # github.com answers curl's blob pages with 503 most of the time
            # (7 of 8 on 2026-10-10, all 3 attempts on every run), while the
            # raw host answers 200 for a file and 404 for a missing one. A blob
            # link claims "this file exists at this ref", so ask the raw host.
            # (go-ndarray/docs#30; `landingkit links` does the same, tested.)
            probe=$u
            case "$u" in
              https://github.com/*/*/blob/*)
                probe=https://raw.githubusercontent.com/$(printf '%s' "${u#https://github.com/}" | sed -E 's#^([^/]+/[^/]+)/blob/#\1/#; s/[?#].*$//') ;;
            esac
            # Three attempts: one is a flake detector rather than a link
            # checker, and a lane that fails at random is a lane people learn
            # to ignore.
            code=000
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "$probe" || echo 000)
              case "$code" in 2*|3*) break ;; esac
              sleep 3
            done
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$u" ;;
              *)     printf '  FAIL %s  %s\n' "$code" "$u"; fail=1 ;;
            esac
          done <<< "$urls"
          test "$fail" -eq 0 || { echo "::error::at least one link or image does not resolve"; exit 1; }
