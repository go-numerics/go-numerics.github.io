# Build + deploy the Hugo site to GitHub Pages on every push to main.
# Adapted from the official Hugo template at
# https://gohugo.io/host-and-deploy/host-on-github-pages/.

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content or
  # the Hugo version has to prove the site still builds before it lands.
  # Without this the workflow ran only on main, which meant a dependency bump
  # arrived with no signal at all -- its checks read "no checks", which is not
  # the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Don't cancel in-progress
# runs — we want them to finish before a new build replaces them.
concurrency:
  group: "pages"
  cancel-in-progress: false

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

env:
  # Pin Hugo so site builds don't break when a new release ships
  # incompatible template changes. Bump deliberately, not by
  # surprise.
  HUGO_VERSION: 0.135.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # The playground at /playground/: go-numerics itself, compiled to
      # WebAssembly inside a go-widgets canvas application (playground/, a
      # nested Go module). Its two assets are build artifacts, never committed:
      # the wasm compiled from this commit and wasm_exec.js from the SAME
      # toolchain. Built before Hugo, which reads the wasm's size for the
      # progress bar.
      - name: Setup Go for the playground
        uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
          cache-dependency-path: |
            playground/go.sum
            notebooks/go.sum

      - name: Build the playground
        working-directory: playground
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: |
          mkdir -p ../static/playground
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=$(git rev-parse --short HEAD)" \
            -o ../static/playground/playground.wasm ./cmd/playground-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../static/playground/
          raw=$(stat -c %s ../static/playground/playground.wasm); gz=$(gzip -9 -c ../static/playground/playground.wasm | wc -c)
          echo "playground.wasm: $raw bytes, $gz gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          # Cache-busts the playground assets: a new deploy is a new URL.
          HUGO_PARAMS_WASMSHA: ${{ github.sha }}
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # The example notebooks, at /notebooks/: the generic go-notebook
      # playground, built here from the version that notebooks/go.mod pins
      # (never a committed binary). The build runs every notebook first and
      # fails if a cell fails.
      - name: Build the notebooks
        working-directory: notebooks
        run: |
          go run github.com/go-notebook/playground/cmd/build \
            -o ../public/notebooks --org go-numerics --home "${{ steps.pages.outputs.base_url }}/" \
            --accent '#7445ad' --accent-dark '#b794e4' notebooks/*.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only main publishes. A pull request stops after build above: it has built
    # the site, which is the whole point of the gate, and it has no business
    # replacing what is served.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
