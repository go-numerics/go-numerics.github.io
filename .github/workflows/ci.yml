name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify
      # A page that builds and says nothing is a page nobody notices is empty.
      - name: every repository is on it
        run: |
          for repo in optimize integrate special docs brand; do
            grep -q "go-numerics/$repo" public/index.html \
              || { echo "::error::$repo is not on the page"; exit 1; }
          done
          echo "the page names every repository this org has"
      # The hero's buttons are the kit's (cta.html, data-kit-cta), in its
      # order and styles, and nothing beside the mantra strip says it twice:
      # at the landingkit version go.mod pins.
      - name: the page is the kit's (landingkit check)
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit check public

  # static/img/figure.svg is what figure/main.go draws, with the library
  # versions figure/go.mod names. The page shows that program as the terminal
  # in the hero, so a figure that no longer matches it would be a claim the
  # page cannot back. This draws it again and compares the bytes.
  #
  # On arm64: Go fuses x*y+z into one rounding there (FMA) and not on amd64,
  # so DOP853's float64 values in figure.json differ in the last bit between
  # the two (measured on this PR's first run: the SVG, whose coordinates are
  # rounded, was identical; the JSON was not). The committed values are the
  # arm64 ones, as a Mac writes them, and this job checks them where they
  # are reproducible bit for bit.
  figure:
    name: the figure is what its program draws
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: figure/go.mod
          cache-dependency-path: figure/go.sum
      - name: Draw the figure and its pointer readout
        working-directory: figure
        run: go run . -readout ../static/img/figure.json > ../static/img/figure.svg
      # The readout is the values the page prints under the pointer: a stale
      # one would show numbers the solver no longer returns.
      - name: The committed figure and readout are the ones drawn
        run: |
          if ! git diff --exit-code --stat -- static/img/figure.svg static/img/figure.json; then
            echo "::error::static/img/figure.svg or figure.json differs from what figure/main.go writes: run 'cd figure && go run . -readout ../static/img/figure.json > ../static/img/figure.svg' and commit both"
            exit 1
          fi

  # The built page, in headless Chrome (preinstalled on the amd64 runner,
  # not on arm64): the pointer and the arrow keys must print exactly the
  # values the committed figure.json holds. It reads the JSON, it does not
  # recompute it, so it does not depend on the platform.
  readout:
    name: the page prints the solver's values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: figure/go.mod
          cache-dependency-path: figure/go.sum
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - name: Build the site
        run: hugo --minify -d "$RUNNER_TEMP/site"
      - name: The readout prints the solver's values
        working-directory: figure
        run: SITE_DIR="$RUNNER_TEMP/site" go test -v .
