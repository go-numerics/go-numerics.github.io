# The playground (playground/, a nested Go module): go-numerics compiled to
# WebAssembly inside a go-widgets canvas app. Two gates:
#
#   test           gofmt, vet (native and js/wasm), the native suite under
#                  -race at 100% statement coverage (cmd/playground-wasm is the
#                  js-only shell and is excluded; the gate is internal/covergate,
#                  a Go program with a test), the engine and ViewModel suites
#                  run AS WebAssembly under node, and the wasm build, whose size
#                  is reported. The engine suite also builds and runs every Go
#                  program the page offers and compares what it prints with the
#                  page, row by row.
#   browser-proof  the BUILT page (Hugo + the wasm) in headless Chrome, light
#                  and dark forced, 1x and 2x, plus a phone (390x844 at 3x,
#                  mobile, touch): real clicks, keys and pointer moves, asserted
#                  on the app's state AND on canvas pixels. A missing browser is
#                  a failure here, never a skip.
name: playground

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  test:
    name: test, coverage, wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
          cache-dependency-path: playground/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (native and js/wasm)
        run: go vet ./... && GOOS=js GOARCH=wasm go vet ./...
      - name: test (-race) with coverage
        run: go test -race -count=1 -coverprofile=coverage.out . ./engine ./vm && go test -race -count=1 ./internal/covergate
      - name: 100% statement coverage
        run: go run ./internal/covergate coverage.out
      - name: engine and ViewModel suites as WebAssembly (node)
        run: GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./engine ./vm
      - name: wasm build and size
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/playground.wasm" ./cmd/playground-wasm
          raw=$(stat -c %s "$RUNNER_TEMP/playground.wasm"); gz=$(gzip -9 -c "$RUNNER_TEMP/playground.wasm" | wc -c)
          echo "playground.wasm: $raw bytes, $gz gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

  # The Julia programs of the code panel, run on julia 1.12 with the packages
  # engine/testdata/juliaenv pins (go-embedded-julia does not run Base yet, so
  # no program on the page runs on it, and the page says so). Each program's
  # answer is compared with the page's to the problem's tolerance. The Ruby
  # programs, which do run on go-embedded-ruby, are checked in the test job.
  julia:
    name: the Julia programs agree with the page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    env:
      PLAYGROUND_REQUIRE_JULIA: "1"
      PLAYGROUND_JULIA: julia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
          cache-dependency-path: playground/go.sum
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@v2
      - name: install the packages the Manifest pins
        run: julia --project=engine/testdata/juliaenv -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: run every Julia program
        run: go test -count=1 -timeout 40m -v -run TestJuliaAgreesWithThePage ./engine

  browser-proof:
    name: browser proof (headless Chrome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    env:
      PLAYGROUND_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
          cache-dependency-path: playground/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - name: install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - name: install puppeteer-core
        run: npm install --no-save --prefix "${{ runner.temp }}/pptr" puppeteer-core@24.43.1
      - name: run the proof
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PLAYGROUND_NODE_PATH: ${{ runner.temp }}/pptr/node_modules
          PLAYGROUND_CAPTURE_DIR: ${{ runner.temp }}/captures
        run: go test -count=1 -timeout 30m -v -run 'TestBrowserProof' .
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
